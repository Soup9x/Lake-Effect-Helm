<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helm</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <div class="bar-top">
        <img src="icons/icon-32.png" alt="" width="22" height="22" />
        <div class="bar-title">
          <h1>Helm</h1>
          <p id="tenant" class="bar-sub"></p>
        </div>
        <button id="settings" type="button" class="icon-button on-brand" title="Settings" aria-label="Settings"></button>
      </div>
      <label class="search">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search credentials" autocomplete="off" spellcheck="false" aria-label="Search credentials" />
      </label>
    </header>
    <main id="list" aria-live="polite"></main>
    <p id="status" class="toast" role="status" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
