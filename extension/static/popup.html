<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Helm</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="bar">
      <div class="bar-top">
        <img src="icons/icon-32.png" alt="" width="22" height="22" />
        <div class="bar-title">
          <h1>Helm</h1>
          <p id="tenant" class="bar-sub"></p>
        </div>
        <button id="add" type="button" class="icon-button on-brand" title="Add a login" aria-label="Add a login" hidden></button>
        <button id="lock" type="button" class="icon-button on-brand" title="Lock now" aria-label="Lock now" hidden></button>
        <button id="settings" type="button" class="icon-button on-brand" title="Settings" aria-label="Settings"></button>
      </div>
      <div id="view-head" class="view-head" hidden>
        <button id="back" type="button" class="icon-button on-brand" title="Back" aria-label="Back"></button>
        <p id="view-title" class="view-title"></p>
      </div>
      <label class="search" id="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search credentials" autocomplete="off" spellcheck="false" aria-label="Search credentials" />
      </label>
    </header>
    <main id="list" aria-live="polite"></main>
    <p id="status" class="toast" role="status" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
