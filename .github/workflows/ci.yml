# =============================================================================
# CI
#
# Helm's guarantees are assertions, not intentions: RLS policies, column-level
# grants, SECURITY DEFINER boundaries, an append-only hash-chained audit log.
# Most of them are only true if something checks, and most of them cannot be
# checked without a real PostgreSQL cluster and the real non-superuser roles.
#
# So the database job is the one that matters. It applies every migration to a
# live Postgres 16, runs the SQL security suite as `helm_app`, runs the
# integration tests as each of the five runtime roles, and diffs the Drizzle
# schema against the live catalog. A mock would pass while the product was
# broken.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: no database needed, so this answers in about a minute.
  # ---------------------------------------------------------------------------
  checks:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No version input: package.json's `packageManager` is the single source
      # of truth, so CI cannot install a different pnpm than the Dockerfile.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth, so CI cannot drift from what
          # a contributor's `nvm use` picks.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Two different questions, so two steps.
      #
      # The manifest answers "does this tree match what was recorded", which is
      # the same check the pre-commit hook runs and works with no history.
      - name: Migrations match their manifest
        run: pnpm db:check-migrations

      # The manifest records what the tree contained when somebody last ran
      # --update. If the tree was already wrong then, it records the wrong
      # thing and passes forever — which is exactly how a bad revert of
      # 0340_local_authentication.sql reached a deploy with every check green.
      #
      # HELM_DEPLOYED_REF is the commit an environment has actually applied.
      # Set it as a repository variable and this step answers the question the
      # manifest cannot: does this tree still match what that environment ran.
      - name: Migrations match the deployed baseline
        if: vars.HELM_DEPLOYED_REF != ''
        run: |
          git fetch --no-tags origin "${{ vars.HELM_DEPLOYED_REF }}" || git fetch --no-tags --unshallow origin
          pnpm db:check-migrations --against "${{ vars.HELM_DEPLOYED_REF }}"

      # ...and this answers "has anything already on main been edited", which is
      # the one the manifest cannot answer on its own, because a manifest entry
      # can be re-blessed with --force. A file that has reached main has reached
      # somebody's database. Seven had drifted before this step existed, three of
      # them comment-only — and a comment-only edit fails a deploy exactly as
      # hard, because the checksum covers the whole file.
      - name: No applied migration has been edited in place
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          drifted=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Only files that exist on the base branch are immutable; a
            # migration added by this PR is not yet anybody's applied migration.
            git cat-file -e "$base:$f" 2>/dev/null || continue
            if ! git diff --quiet "$base" -- "$f"; then
              echo "::error file=$f::$f is on $base and has been modified. Applied migrations are immutable - write a new migration instead."
              drifted=1
            fi
          done < <(git diff --name-only "$base"...HEAD -- 'db/sql/*.sql')
          if [ "$drifted" -ne 0 ]; then
            echo ""
            echo "db/migrate.ts hashes the whole file, so a changed comment breaks a"
            echo "deploy exactly as hard as a changed ALTER TABLE."
            exit 1
          fi
          echo "  ok  no migration on $base was modified"

      # Every route is force-dynamic, so nothing is prerendered and the build
      # needs no database connection.
      - name: Build the web tier and the worker bundle
        run: pnpm build && pnpm build:worker

      - name: Shell scripts parse
        run: |
          for f in deploy/*.sh scripts/*.sh deploy/postgres/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" && echo "  ok  $f"
          done

  # ---------------------------------------------------------------------------
  # The real one.
  # ---------------------------------------------------------------------------
  database:
    name: Tests against PostgreSQL 16
    runs-on: ubuntu-latest

    services:
      postgres:
        # Matches docker-compose.yml, so CI and production disagree about as
        # little as possible.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helm
          POSTGRES_USER: postgres
          # Trust, because the suites connect as five different runtime roles
          # that 0000_bootstrap creates WITHOUT passwords. This is an ephemeral
          # container on a private network inside a single job; the production
          # stack uses scram-sha-256 everywhere (deploy/postgres/10-roles.sh).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The standard libpq names, honoured by the harness, both shell scripts
      # and scripts/check-drift.ts. A local dev cluster uses a unix socket
      # directory here instead; CI uses the service container's address.
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: helm
      PGUSER: postgres
      PGSUPERUSER: postgres

    steps:
      - uses: actions/checkout@v7

      # No version input: package.json's `packageManager` is the single source
      # of truth, so CI cannot install a different pnpm than the Dockerfile.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth, so CI cannot drift from what
          # a contributor's `nvm use` picks.
          node-version-file: .nvmrc
          cache: pnpm

      # The runner's bundled client is older than the server. Everything here
      # would probably work anyway, but "probably" is not a property worth
      # having in the job that verifies tenant isolation.
      - name: Install PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          psql --version

      - name: Install
        run: pnpm install --frozen-lockfile

      # First, because it rebuilds the database from db/sql/*.sql and that is
      # what creates the five runtime roles the other suites connect as.
      - name: SQL security suite
        run: pnpm test:sql

      - name: Unit and integration tests
        run: pnpm test

      # From a known state: the integration suites leave the database wherever
      # the last one finished.
      - name: Schema drift
        run: |
          ./scripts/rebuild-test-db.sh > /dev/null
          pnpm db:drift

  # ---------------------------------------------------------------------------
  # The images, because twice now a green CI has shipped an image that could not
  # be built. `next build` reading the environment at module scope passed here
  # and failed in Docker; then corepack resolved a pnpm newer than the one this
  # workflow pins and `pnpm install` turned an ignored-build warning into a hard
  # error. Neither was reachable from any test.
  #
  # Building the real targets is the only check that answers the question an
  # operator actually asks: does `docker compose up -d --build` work.
  # ---------------------------------------------------------------------------
  images:
    name: Docker images build and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the runtime image
        run: docker build --target runtime -t helm-runtime:ci .

      - name: Build the migrate image
        run: docker build --target migrate -t helm-migrate:ci .

      # @node-rs/argon2 ships prebuilt native binaries per platform. Every local
      # password in Helm goes through it, and a musl binary that does not load
      # would take the break-glass sign-in with it.
      - name: The argon2 native binary loads on musl
        run: |
          docker run --rm helm-runtime:ci node -e '
            const argon2 = require("@node-rs/argon2");
            argon2.hash("correct horse battery staple").then((h) => {
              if (!h.startsWith("$argon2id$")) { console.error("unexpected:", h); process.exit(1); }
              console.log("  ok  argon2id:", h.slice(0, 32));
            }).catch((e) => { console.error(e); process.exit(1); });
          '

      - name: The worker bundle is in the runtime image
        run: docker run --rm helm-runtime:ci test -f dist/worker.mjs

      # The migrate image holds SUPERUSER credentials. It must not also carry
      # the test runner and the build toolchain.
      #
      # Both the hoisted path and pnpm's store are checked: a top-level lookup
      # alone would pass for a package that is merely not hoisted, which is not
      # the same as absent. (esbuild is deliberately not in this list — tsx
      # depends on it, and tsx is the migrate image's runtime.)
      - name: The migrate image ships no dev toolchain
        run: |
          for pkg in vitest typescript drizzle-kit @vitest/mocker; do
            found=$(docker run --rm helm-migrate:ci sh -c \
              "ls -d node_modules/$pkg node_modules/.pnpm/*$pkg@* 2>/dev/null | head -3")
            if [ -n "$found" ]; then
              echo "  FAIL  $pkg is present in the migrate image:"; echo "$found"; exit 1
            fi
            echo "  ok    $pkg absent"
          done

      # No database here, so this must fail on the CONNECTION, never on module
      # resolution — a resolution error means the production-only tree is
      # missing something the entry points import.
      - name: The migrate entry point resolves against the production-only tree
        run: |
          out=$(docker run --rm -e PGHOST=127.0.0.1 -e PGPORT=1 -e PGCONNECT_TIMEOUT=3 \
                  helm-migrate:ci node_modules/.bin/tsx db/migrate.ts --status 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qiE "cannot find module|ERR_MODULE_NOT_FOUND|ERR_PACKAGE_PATH_NOT_EXPORTED"; then
            echo "  FAIL  module resolution broke without the dev tree"; exit 1
          fi
          echo "  ok    resolves; failed on the database as expected"

  # ---------------------------------------------------------------------------
  # The install, actually installed.
  #
  # `images` proves the images build. It does not prove the stack comes UP, and
  # that gap cost a real first install: Caddy's healthcheck requested
  # https://127.0.0.1/api/health, which sends no SNI (RFC 6066 forbids IP
  # addresses there), so Caddy could not choose a certificate and killed the
  # handshake with alert 80. Caddy was serving browsers correctly the whole
  # time — only the check was wrong — and `up --wait` failed an install that
  # had succeeded.
  #
  # Nothing short of running the real entry point would have caught that. So
  # this job runs deploy/setup.sh unattended, exactly as the guide tells an
  # operator to, and then asks a browser's question through Caddy.
  # ---------------------------------------------------------------------------
  stack:
    name: The stack comes up
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: sudo ./deploy/setup.sh
        run: |
          sudo ./deploy/setup.sh --yes \
            --host        helm.ci.internal \
            --tenant      "CI Managed Services" \
            --slug        ci-managed \
            --admin-email admin@ci.internal \
            --admin-name  "CI Admin"

      - name: Every container reports healthy
        run: |
          sudo docker compose ps
          bad=0
          for c in $(sudo docker compose ps -q); do
            name=$(sudo docker inspect --format '{{.Name}}' "$c")
            health=$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
            printf '  %-40s %s\n' "$name" "$health"
            case "$health" in
              healthy|none) ;;
              *) bad=1; sudo docker inspect --format '{{json .State.Health}}' "$c" ;;
            esac
          done
          [ "$bad" -eq 0 ] || { echo "  FAIL  a container is not healthy"; exit 1; }

      # The question a browser asks: TLS terminates at Caddy with a certificate
      # it could actually select, and the proxy reaches the web tier behind it.
      - name: A browser can reach the sign-in page through Caddy
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' \
            --resolve helm.ci.internal:443:127.0.0.1 \
            https://helm.ci.internal/sign-in)
          echo "  /sign-in -> $code"
          [ "$code" = "200" ] || { echo "  FAIL  expected 200"; exit 1; }

          body=$(curl -sk --resolve helm.ci.internal:443:127.0.0.1 \
            https://helm.ci.internal/api/health)
          echo "  /api/health -> $body"
          case "$body" in
            *'"status":"ok"'*) echo "  ok    database reachable from the web tier" ;;
            *) echo "  FAIL  health is not ok"; exit 1 ;;
          esac

      - name: Tear down
        if: always()
        run: sudo docker compose down -v --remove-orphans || true

  # ---------------------------------------------------------------------------
  # Advisory. Non-blocking on purpose — see the note below.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Non-blocking, and the reason is specific rather than habitual. The
    # remaining findings are all in DEV tooling — vitest and the esbuild that
    # drizzle-kit pulls in — and neither ships: the runtime image carries only
    # the traced server output, and the migrate image installs with --prod.
    # Neither has a fix inside its pinned major, and vitest 5 does not honour
    # this suite's fileParallelism setting, so every integration file races for
    # the same database.
    #
    # Anything that reaches a shipped artifact is a different matter and should
    # be fixed rather than annotated. When the dev-only findings clear, drop
    # continue-on-error and this becomes a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      # No version input: package.json's `packageManager` is the single source
      # of truth, so CI cannot install a different pnpm than the Dockerfile.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the single source of truth, so CI cannot drift from what
          # a contributor's `nvm use` picks.
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level moderate
