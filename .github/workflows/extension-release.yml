# =============================================================================
# Browser extension release
#
# Publishes the built extension as a GitHub release, so a browser on a machine
# without a checkout can fetch it from a fixed address:
#
#   https://github.com/Soup9x/Lake-Effect-Helm/releases/latest/download/helm-extension.zip
#
# One release per version in extension/manifest.json, tagged extension-v<version>.
# A push that does not raise the version publishes nothing, so the release a
# version names never changes underneath anybody who already loaded it.
# =============================================================================
name: Extension release

on:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'src/lib/extension/**'
      - 'scripts/build-extension.mjs'
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish the extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version extension/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "extension-v$version" > /dev/null 2>&1; then
            echo "extension-v$version is already published; raise the version in extension/manifest.json to publish again."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.exists != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.version.outputs.exists != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.version.outputs.exists != 'true'
        name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm build:extension
          # The same zip under a name without the version, for the fixed
          # latest/download address above.
          cp "dist/helm-extension-${{ steps.version.outputs.version }}.zip" dist/helm-extension.zip

      - if: steps.version.outputs.exists != 'true'
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "extension-v$VERSION" \
            "dist/helm-extension-$VERSION.zip" dist/helm-extension.zip \
            --target "$GITHUB_SHA" \
            --title "Browser extension $VERSION" \
            --latest \
            --notes "Unzip, then load the folder unpacked from chrome://extensions, brave://extensions or edge://extensions with Developer mode on. Setup is in extension/README.md."
